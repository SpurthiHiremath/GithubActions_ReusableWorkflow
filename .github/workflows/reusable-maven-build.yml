name: Reusable Maven Build

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build Maven project
        run: mvn clean package

      - name: Print AWS Values
        run: |
             echo "region: ${{ vars.AWS_REGION }}"
             echo "arn: ${{ vars.AWS_ROLE_ARN }}"
             echo "bucket: ${{ vars.S3_BUCKET }}"

