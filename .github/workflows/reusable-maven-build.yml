name: Reusable Maven Build

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:      
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build Maven project
        run: mvn clean package

      - name: Print AWS Values
        run: |
             echo "region: ${{ vars.AWS_REGION }}"
             echo "bucket: ${{ vars.S3_BUCKET_DEV_TEST }}"
             echo "bucket_prod: ${{ vars.S3_BUCKET_PROD }}"
       
      - name: Configure AWS credentials - DEV
        if: inputs.environment == 'dev' || inputs.environment == 'test' 
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Configure AWS credentials - PROD
        if: inputs.environment == 'prod'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_PROD }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}
          aws-region: ${{ vars.AWS_REGION }}
          
      - name: Check AWS identity
        run: aws sts get-caller-identity
        
      - name: Upload JAR to S3
        run: |
           if [ "${{ inputs.environment }}" == "dev" ] || [ "${{ inputs.environment }}" == "test" ]; then
             aws s3 cp target/*.jar s3://${{ vars.S3_BUCKET_DEV_TEST }}/${{ inputs.environment }}/
           elif [ "${{ inputs.environment }}" == "prod" ]; then
             aws s3 cp target/*.jar s3://${{ vars.S3_BUCKET_PROD }}/${{ inputs.environment }}/
           else
            echo "Invalid environment: ${{ inputs.environment }}"
            exit 1
           fi
           fi
