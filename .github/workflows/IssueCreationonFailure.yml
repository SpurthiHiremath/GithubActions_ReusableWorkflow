name: Create Issue on Workflow Failure

on:
  workflow_run:
    workflows: ["Reusable Maven Build"]
    types:
      - completed

permissions:
  issues: write

jobs:
  create-issue:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest

    steps:
      - name: Create issue on failure
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Workflow failed: ${context.payload.workflow_run.name}`,
              body: `
              Workflow: ${context.payload.workflow_run.name}
              Run ID: ${context.payload.workflow_run.id}
              Branch: ${context.payload.workflow_run.head_branch}
              Commit: ${context.payload.workflow_run.head_sha}
              `,
              labels: ['workflow-failure']
            })
